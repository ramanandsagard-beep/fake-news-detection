version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend/trained_models:/app/trained_models
      - ./backend/fake_news.db:/app/fake_news.db
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./fake_news.db
      - FRONTEND_URL=http://localhost:5173
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always
